<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Casos: dos formatos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&family=Linden+Hill&family=Montserrat:wght@400;700&display=swap">
<style>
/* Prototipo de formatos para la sección Trabajo (2026-09-22). Fuera de src/: no entra en el build. */
:root {
  --ground: #12241c; --ground-deep: #0a1410; --ink: #f1e6d0; --ink-soft: #b7b09c;
  --accent: #ef7a5a; --line: rgba(241, 230, 208, 0.18);
  --film: #0b0a09; --edge: #e8a33a; /* borde de negativo y rotulado ámbar de película */
  --gutter: clamp(16px, 5vw, 64px);
  --display: "Bricolage Grotesque", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { background: var(--ground-deep); }
body {
  margin: 0; color: var(--ink);
  background: linear-gradient(180deg, var(--ground), var(--ground-deep)) fixed;
  font: 400 1.0625rem/1.6 "Instrument Sans", system-ui, sans-serif;
  padding: 0 var(--gutter) 96px;
}
.wrap { max-width: 72rem; margin-inline: auto; }
.mono { font-family: var(--mono); font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; }
.soft { color: var(--ink-soft); }

/* Selector de versión */
.switch {
  position: sticky; top: 0; z-index: 10; display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
  padding: 16px 0; background: color-mix(in srgb, var(--ground-deep) 88%, transparent); backdrop-filter: blur(6px);
}
.switch button {
  font: inherit; font-size: .95rem; color: var(--ink); background: none; cursor: pointer;
  border: 1px solid var(--line); border-radius: 999px; padding: 8px 16px;
}
.switch button[aria-pressed="true"] { background: var(--ink); color: var(--ground); border-color: var(--ink); }
.switch .mono { margin-left: auto; color: var(--ink-soft); }
[data-view]:not(.on) { display: none; }

.block-head { display: flex; justify-content: space-between; gap: 16px; border-top: 1px solid var(--line); padding-top: 40px; margin-top: 24px; color: var(--ink-soft); }

/* Cabecera común de cada caso */
.head { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: 8px 40px; align-items: end; margin-bottom: 20px; }
.head h3 { margin: 0; font-family: var(--display); font-weight: 500; font-size: clamp(1.75rem, 3.4vw, 2.5rem); letter-spacing: -.02em; line-height: 1.1; }
.head .result { margin: 0; font-size: clamp(1.0625rem, 1.6vw, 1.25rem); line-height: 1.4; }
.pending { color: var(--ink-soft); border: 1.5px dashed var(--line); padding: 4px 10px; display: inline-block; }
@media (max-width: 720px) { .head { grid-template-columns: 1fr; } }

/* ============ A · Hoja de contactos ============ */
.sheet-case { padding-block: 40px; border-bottom: 1px solid var(--line); }
.strip {
  display: flex; gap: 0; overflow-x: auto; width: fit-content; max-width: 100%; scroll-snap-type: x mandatory; overscroll-behavior-x: contain;
  background: var(--film); padding: 26px 0; border-radius: 2px; position: relative;
  scrollbar-width: thin; scrollbar-color: #333 transparent;
  /* perforaciones arriba y abajo */
  background-image:
    radial-gradient(circle at 50% 50%, var(--ground-deep) 0 3.5px, transparent 4px),
    radial-gradient(circle at 50% 50%, var(--ground-deep) 0 3.5px, transparent 4px);
  background-size: 22px 26px, 22px 26px;
  background-position: 0 0, 0 100%;
  background-repeat: repeat-x;
}
.frame { flex: 0 0 auto; scroll-snap-align: start; padding: 0 10px; position: relative; margin: 0; }
.frame a { display: block; }
.frame img {
  display: block; height: clamp(180px, 26vw, 300px); aspect-ratio: 3 / 2; width: auto;
  object-fit: cover; object-position: top; filter: saturate(.92) contrast(1.02);
}
.frame.tall img { aspect-ratio: 2 / 3; }
.frame figcaption {
  position: absolute; left: 10px; right: 10px; bottom: -21px;
  display: flex; justify-content: space-between;
  font-family: var(--mono); font-size: .625rem; letter-spacing: .12em; color: var(--edge);
}
.frame::before { /* rotulado del borde superior */
  content: attr(data-edge); position: absolute; left: 10px; top: -20px;
  font-family: var(--mono); font-size: .625rem; letter-spacing: .14em; color: var(--edge); opacity: .8; white-space: nowrap;
}
.hint { margin-top: 10px; color: var(--ink-soft); }

/* ============ B · Ficha en mosaico ============ */
.bento-case { padding-block: 40px; border-bottom: 1px solid var(--line); }
.bento { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-auto-rows: minmax(120px, auto); gap: 12px; }
.tile { border-radius: 6px; overflow: hidden; background: color-mix(in srgb, var(--ground-deep) 70%, transparent); border: 1px solid var(--line); padding: 16px; display: flex; flex-direction: column; justify-content: space-between; gap: 12px; min-width: 0; }
.tile.img { padding: 0; border: 0; }
.tile.img img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
.tile.big { grid-column: span 2; grid-row: span 2; }
.tile.wide { grid-column: span 2; }
.tile .label { color: var(--ink-soft); }
.type-sample { font-size: clamp(2rem, 4vw, 3.25rem); line-height: 1; overflow-wrap: anywhere; }
.type-names { font-size: .9rem; color: var(--ink-soft); }
.swatches { display: flex; gap: 6px; flex: 1; min-height: 64px; }
.swatches span { flex: 1; border-radius: 4px; position: relative; border: 1px solid rgba(255,255,255,.08); }
.swatches small { position: absolute; left: 6px; bottom: 4px; font-family: var(--mono); font-size: .5625rem; letter-spacing: .06em; mix-blend-mode: difference; color: #fff; }
.tile.result p { margin: 0; font-family: var(--display); font-weight: 500; font-size: clamp(1.125rem, 1.8vw, 1.375rem); line-height: 1.25; }
@media (max-width: 860px) {
  .bento { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .tile.big { grid-column: span 2; grid-row: span 1; aspect-ratio: 16 / 10; }
}
</style>
</head>
<body>
<div class="wrap">
  <div class="switch" role="group" aria-label="Versión">
    <button type="button" data-show="sheet" aria-pressed="true">A · Hoja de contactos</button>
    <button type="button" data-show="bento" aria-pressed="false">B · Ficha en mosaico</button>
    <span class="mono">Prototipo · solo para decidir</span>
  </div>

  <div class="block-head"><span class="mono">Trabajo</span><span class="mono" id="count"></span></div>

  <section data-view="sheet" class="on" id="sheet"></section>
  <section data-view="bento" id="bento"></section>
</div>

<script>
const IMG = '../../public/assets/projects/';
// type/palette: solo con fuente. null = por confirmar.
const CASES = [
  {
    name: 'Galería i23', meta: 'Web de apertura · WordPress',
    result: 'La galería lleva tres temporadas de exposiciones publicadas por su cuenta, sin mí.',
    frames: [['i23/portada.webp']],
    type: { names: 'Graphik + Tiempos Headline', note: 'archivos en curro TAI/04.i23', sample: 'i23', css: 'font-family: "Tiempos Headline", Georgia, serif; font-weight: 700' },
    palette: ['#607a9c', '#e0ddd4', '#111111'], paletteNote: 'medido de la foto'
  },
  {
    name: 'Escuela TAI', meta: 'Mantenimiento y diseño · 2022–2024',
    result: 'Sigue online y la editan ellos. Un año después de irme me volvieron a llamar para cubrir una baja.',
    frames: [['tai/portada.webp'], ['tai/degrees-in-english.webp', 'tall']],
    type: { names: 'Lausanne (por confirmar)', note: 'hay un Lausanne-300.ttf en curro TAI', sample: 'Artes', css: 'font-family: "Helvetica Neue", Arial, sans-serif; font-weight: 300' },
    palette: ['#0d151d', '#877f77', '#c6c4c3'], paletteNote: 'medido de la captura'
  },
  {
    name: 'Factoría de Creación', meta: 'Diseño y web',
    result: null,
    frames: [['factoria/portada-mockup.webp'], ['factoria/pagina-1.webp', 'tall'], ['factoria/pagina-2.webp', 'tall'], ['factoria/pagina-3.webp', 'tall'], ['factoria/pagina-4.webp', 'tall']],
    type: { names: 'Linden Hill + Montserrat', note: 'dato de Alicia', sample: 'Amanece', css: 'font-family: "Linden Hill", serif', sample2: 'PRODUCCIONES', css2: 'font-family: Montserrat, sans-serif; font-weight: 700; letter-spacing: .08em; font-size: .9rem' },
    palette: ['#16110f', '#8c8077', '#ffffff'], paletteNote: 'medido de la captura'
  },
  {
    name: 'Festival WE:NOW', meta: 'Web y ecommerce · WordPress',
    result: null,
    frames: [['wenow/portada-2024.webp'], ['wenow/expos.webp']],
    type: null,
    palette: ['#f6dc00', '#0766bf', '#070f1b'], paletteNote: 'medido de la captura'
  },
  {
    name: 'AI Wrapped', meta: 'Diseño y desarrollo',
    result: null,
    frames: [['aiwrapped/detalle-3.webp'], ['aiwrapped/detalle-4.webp', 'tall'], ['aiwrapped/detalle-5.webp']],
    type: null,
    palette: ['#122143', '#163b4b', '#61798d'], paletteNote: 'medido de la captura'
  }
];

const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const head = c => `
  <div class="head">
    <div><h3>${esc(c.name)}</h3><span class="mono soft">${esc(c.meta)}</span></div>
    ${c.result ? `<p class="result">${esc(c.result)}</p>` : `<span class="mono pending">Resultado pendiente</span>`}
  </div>`;

// A · Hoja de contactos: numeración continua entre casos, como un carrete
let n = 1;
document.getElementById('sheet').innerHTML = CASES.map((c, ci) => head(c) + `
  <div class="strip" aria-label="Imágenes de ${esc(c.name)}">
    ${c.frames.map(([src, kind]) => {
      const num = String(n).padStart(2, '0'); n++;
      return `<figure class="frame ${kind || ''}" data-edge="ALICIA VB 400  ${num}">
        <a href="${IMG + src}" target="_blank" rel="noopener"><img src="${IMG + src}" alt="${esc(c.name)}, fotograma ${num}" loading="lazy"></a>
        <figcaption><span>▸ ${num}</span><span>${num}A</span></figcaption>
      </figure>`;
    }).join('')}
  </div>
  ${c.frames.length > 2 ? '<p class="mono hint">Desliza →</p>' : ''}`
).map(h => `<article class="sheet-case">${h}</article>`).join('');

// B · Ficha en mosaico
document.getElementById('bento').innerHTML = CASES.map(c => {
  const [first, ...rest] = c.frames;
  const typeTile = c.type
    ? `<div class="tile wide"><span class="mono label">Tipografía</span>
         <div><div class="type-sample" style='${c.type.css}'>${esc(c.type.sample)}</div>
         ${c.type.sample2 ? `<div style='${c.type.css2}'>${esc(c.type.sample2)}</div>` : ''}</div>
         <span class="type-names">${esc(c.type.names)} · <span class="mono">${esc(c.type.note)}</span></span></div>`
    : `<div class="tile wide"><span class="mono label">Tipografía</span><span class="mono pending">Por confirmar</span></div>`;
  const palTile = `<div class="tile"><span class="mono label">Color</span>
      <div class="swatches">${c.palette.map(h => `<span style="background:${h}"><small>${h}</small></span>`).join('')}</div>
      <span class="mono label">${esc(c.paletteNote)}</span></div>`;
  const resTile = `<div class="tile result"><span class="mono label">Resultado</span>
      ${c.result ? `<p>${esc(c.result)}</p>` : '<span class="mono pending">Pendiente</span>'}</div>`;
  const extra = rest[0] ? `<div class="tile img"><img src="${IMG + rest[0][0]}" alt="" loading="lazy"></div>` : '';
  return `<article class="bento-case">
    <div class="head"><div><h3>${esc(c.name)}</h3><span class="mono soft">${esc(c.meta)}</span></div></div>
    <div class="bento">
      <div class="tile img big"><img src="${IMG + first[0]}" alt="${esc(c.name)}" loading="lazy"></div>
      ${typeTile}${palTile}${resTile}${extra}
    </div></article>`;
}).join('');

document.getElementById('count').textContent = CASES.length + ' casos';
document.querySelectorAll('.switch button').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.switch button').forEach(x => x.setAttribute('aria-pressed', x === b));
  document.querySelectorAll('[data-view]').forEach(v => v.classList.toggle('on', v.dataset.view === b.dataset.show));
}));
</script>
</body>
</html>
